name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable
      - run: dart pub global activate jaspr_cli
      - run: dart pub get
      - run: dart run slang
      - run: jaspr build --dart-define=BASE_PATH=/pola-barcodes/
      # Build-time artifacts that are not needed to serve the site.
      - run: rm -rf build/jaspr/packages build/jaspr/.dart_tool build/jaspr/.build.manifest
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jaspr
