name: pola_barcodes
description: "A web app for displaying and managing barcodes used in the Pola project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  barcode: ^2.2.9
  http: ^1.2.2
  jaspr: ^0.23.3
  jaspr_router: ^0.8.3
  json_annotation: ^4.12.0
  slang: ^4.19.0
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  jaspr_builder: ^0.23.2
  json_serializable: ^6.14.1
  lints: ^6.1.0

jaspr:
  mode: static
