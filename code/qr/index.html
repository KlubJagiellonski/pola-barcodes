<!DOCTYPE html>
<html lang="pl">
  <head>
    <base href="/pola-barcodes/"/>
    <meta charset="utf-8"/>
    <style>
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: #333333;
        background-color: white;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
    </style>
    <link href="manifest.json" rel="manifest"/>
    <link type="image/png" href="favicon.png" rel="icon"/>
    <link href="icons/Icon-192.png" rel="apple-touch-icon"/>
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
      
    </script>
    <!--$-->
    <title>Kod QR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Testowe kody kreskowe dla projektu Pola."/>
    <!--/-->
    <script src="main.client.dart.js" defer></script>
    <style>
      .page {
        display: flex;
        height: 100vh;
        flex-direction: column;
      }
      .page-content {
        padding: 8px;
        overflow-y: auto;
        flex-grow: 1;
      }
      .barcode-view {
        display: flex;
        flex-direction: column;
        align-items: start;
        gap: 6px;
      }
      .barcode-view .barcode-description {
        font-size: 17px;
        font-weight: bold;
      }
      .barcode-view .barcode-error {
        color: red;
      }
      .barcode-view .barcode-svg svg {
        width: 200px;
        height: 100px;
      }
      .barcode-view .barcode-svg.qr svg {
        width: 100px;
      }
      .barcodes-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .barcode-tile {
        padding-top: 4px;
        padding-bottom: 4px;
        color: inherit;
        text-decoration: none;
      }
      .barcodes-panel {
        display: flex;
        padding: 8px;
        flex-wrap: wrap;
        align-items: end;
        gap: 10px;
      }
      .barcodes-panel .panel-field {
        display: flex;
        min-width: 140px;
        flex-direction: column;
        gap: 4px;
        flex-grow: 1;
        flex-basis: auto;
      }
      .barcodes-panel .field-label {
        color: #5B5B5B;
        font-size: 12px;
      }
      .barcodes-panel input, select {
        height: 36px;
        padding-left: 8px;
        padding-right: 8px;
        border: solid #C4C4C4 1px;
        border-radius: 4px;
        font-size: 15px;
        background-color: white;
      }
      .barcodes-panel .field-error {
        min-height: 16px;
        color: red;
        font-size: 12px;
      }
      .barcodes-panel .add-button {
        height: 36px;
        padding-left: 16px;
        padding-right: 16px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        color: white;
        font-size: 14px;
        font-weight: 500;
        background-color: #D8152F;
      }
      .barcodes-panel .add-button:hover {
        background-color: #B01126;
      }
      .app-bar {
        display: flex;
        min-height: 56px;
        padding-left: 16px;
        padding-right: 16px;
        align-items: center;
        gap: 12px;
        color: white;
        background-color: #D8152F;
      }
      .app-bar h1 {
        margin: 0;
        overflow: hidden;
        font-size: 20px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .app-bar .home-link {
        color: white;
        font-size: 28px;
        text-decoration: none;
        line-height: 1em;
      }
      .app-bar .github-link {
        display: flex;
        align-items: center;
        color: white;
        line-height: 0em;
        margin-left: auto;
      }
      .detail-content {
        display: flex;
        padding: 16px;
        align-items: start;
        gap: 16px;
      }
      .detail-content .detail-json {
        min-width: 0px;
        flex-grow: 1;
      }
      .detail-content .detail-json p {
        margin: 0;
        font-size: 16px;
      }
      .detail-content .json-view {
        margin: 0;
        overflow-x: auto;
        font-size: 14px;
      }
      .detail-content .loading-view {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .detail-content .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: solid #D8152F 2px;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 800ms linear infinite;
      }
      .detail-content .retry-button {
        height: 36px;
        padding-left: 16px;
        padding-right: 16px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        color: white;
        font-size: 14px;
        background-color: #D8152F;
      }
      .detail-content .retry-button:hover {
        background-color: #B01126;
      }
      @media screen and (orientation: portrait) {
        .detail-content {
          flex-direction: column;
        }
        .detail-json {
          width: 100%;
        }
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
